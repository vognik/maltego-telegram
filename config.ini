[telegram]
# Telegram MTProto API credentials from https://my.telegram.org
api_id = 
api_hash = 
session_name = my_account

[bots]
# Telegram bot logins (usernames without @) used via MTProto
# Universal bot to resolve Telegram user ID (e.g. from sticker pack) to username
user_lookup_bot = usinfobot
# Universal bot to search groups associated with a user profile
group_search_bot = tgscanrobot

[misc]
# Message history scan limit per channel/chat (default: 100)
limit = 100
# Maximum concurrent async tasks (downloads/resolves)
concurrency = 10
# Timeout for MTProto operations and bot queries (seconds)
timeout = 15

[tgscan]
# Shortcut to toggle mode: false = production API, true = test API
test_mode = false

# TgScan API keys for production and test environments
api_key_prod = 
api_key_test = 

# Endpoints for production and test API
url_prod = https://api.tgdev.io/tgscan/v1/search
url_test = https://api.tgdev.io/tgscan/v1/test/search